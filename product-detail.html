<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mahsulot haqida | MEGA SHOP</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/product-detail.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body>

    <!-- HEADER -->

    <header class="header">

        <div class="container">

            <a href="index.html" class="logo">
                MEGA <span>SHOP</span>
            </a>

            <nav class="navbar">
                <a href="index.html">Bosh sahifa</a>
                <a href="products.html">Mahsulotlar</a>
                <a href="favorites.html">❤️ Saralanganlar</a>
                <a href="login.html">Kirish</a>
            </nav>

            <a href="cart.html" class="cart-link">
                🛒 Savat
                <span id="cartCount">0</span>
            </a>

        </div>

    </header>

    <!-- PRODUCT DETAIL -->

    <main class="product-detail-page">

        <div class="detail-breadcrumb">
            <a href="index.html">Bosh sahifa</a>
            <span> / </span>
            <a href="products.html">Mahsulotlar</a>
            <span> / </span>
            <span>Mahsulot haqida</span>
        </div>

        <section class="product-detail" id="productDetail">

            <div class="detail-image">

                <img id="detailImage" src="" alt="Mahsulot rasmi">

            </div>

            <div class="detail-info">

                <span class="detail-category" id="detailCategory">
                    Kategoriya
                </span>

                <h1 id="detailName">
                    Mahsulot nomi
                </h1>

                <div class="detail-rating" id="detailRating">
                    ⭐ 0.0
                </div>

                <div class="detail-prices">

                    <strong id="detailPrice">
                        0 so'm
                    </strong>

                    <del id="detailOldPrice">
                        0 so'm
                    </del>

                </div>

                <p class="detail-description" id="detailDescription">
                    Mahsulot haqida ma'lumot.
                </p>

                <div class="detail-actions">

                    <button class="detail-cart-btn" id="detailCartBtn">
                        🛒 Savatga qo'shish
                    </button>

                    <button class="detail-favorite-btn" id="detailFavoriteBtn">
                        ♡ Saralanganlarga
                    </button>

                </div>

                <div class="detail-features">

                    <p>🚚 Tezkor yetkazib berish</p>

                    <p>🛡️ Sifat kafolati</p>

                    <p>💳 Qulay to'lov imkoniyati</p>

                </div>

            </div>

        </section>

    </main>

    <!-- FOOTER -->

     

    <script src="js/products.js"></script>
    <script src="js/main.js"></script>
    <script src="js/product-detail.js"></script>
    <script src="js/footer.js"></script>

</body>

</html>
