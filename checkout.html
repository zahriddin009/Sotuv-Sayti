<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Buyurtma berish | MEGA SHOP</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/checkout.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body>

    <!-- HEADER -->

    <header class="header">
        <div class="container">

            <a href="index.html" class="logo">
                MEGA <span>SHOP</span>
            </a>

            <nav>
                <a href="index.html">Bosh sahifa</a>
                <a href="products.html">Mahsulotlar</a>
                <a href="cart.html">Savat 🛒</a>
            </nav>

        </div>
    </header>


    <!-- CHECKOUT -->

    <main class="checkout-page">

        <h1>Buyurtmani rasmiylashtirish</h1>

        <div class="checkout-layout">

            <form id="checkoutForm">

                <h2>Yetkazib berish ma'lumotlari</h2>

                <label>Ism va familiya</label>

                <input type="text" id="customerName" placeholder="Ismingizni kiriting" required>

                <label>Telefon raqami</label>

                <input type="tel" id="customerPhone" placeholder="+998 90 123 45 67" required>

                <label>Yetkazib berish manzili</label>

                <input type="text" id="customerAddress" placeholder="Viloyat, tuman, ko'cha" required>

                <label>Qo'shimcha izoh</label>

                <textarea id="customerComment" placeholder="Qo'shimcha ma'lumot..."></textarea>

                <button type="submit">
                    Buyurtmani tasdiqlash
                </button>

            </form>


            <!-- ORDER SUMMARY -->

            <div class="checkout-summary">

                <h2>Buyurtma xulosasi</h2>

                <div id="checkoutItems"></div>

                <div class="checkout-total">
                    <span>Jami:</span>
                    <strong id="checkoutTotal">0 so'm</strong>
                </div>

            </div>

        </div>

    </main>


    <footer class="footer">
        <p>© 2026 MEGA SHOP. Barcha huquqlar himoyalangan.</p>
    </footer>


    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
    <script src="js/checkout.js"></script>

</body>

</html>
